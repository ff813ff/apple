name: Sync product images

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "assets/image-sources.json"
      - "scripts/sync_images.py"
      - ".github/workflows/sync-product-images.yml"
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install --disable-pip-version-check pillow requests

      - name: Download and normalize exact product images
        run: python scripts/sync_images.py --force

      - name: Commit local product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products assets/image-sync-report.json
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "chore: sync local product images"
            git push
          fi
